<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Planet Pétanque</title>
<meta name="description" content="Planet Pétanque : suivez vos résultats de pétanque, vos statistiques, vos matchs du club et vos matchs entre copains. Site en construction.">
<script>
  // Les liens d'invitation déjà envoyés (planetpetanque.com/?c=CODE) mènent à la page d'invitation, avec leur code.
  if (/[?&]c=/.test(location.search)) location.replace('/invitation/' + location.search);
</script>
<style>
  :root { --nuit:#13213D; --bleu:#1F5C8C; --bleuTexte:#1E5B8C; --orange:#E8590C; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(180deg, #BFDDF5 0%, #E9F3FB 70%, #F5F7F7 100%);
    font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color:var(--nuit); text-align:center; }
  main { padding:32px 16px; max-width:1132px; width:100%; }
  .bandeauImage { width:100%; max-width:1100px; height:auto; display:block; margin:0 auto 28px; border-radius:18px; box-shadow:0 10px 30px rgba(19,33,61,.18); }
  h1 { font-size:clamp(44px, 9vw, 84px); margin:0; letter-spacing:-1px; color:var(--bleu); font-weight:900; line-height:1.05; }
  h1 + p { margin-top:16px; }
  p { font-size:clamp(17px, 2.6vw, 22px); line-height:1.5; color:var(--bleuTexte); margin:0 auto; max-width:560px; }
</style>
</head>
<body>
<main>
  <img class="bandeauImage" src="/accueil.jpg" srcset="/accueil-1000.jpg 1000w, /accueil.jpg 2172w" sizes="(max-width: 1100px) 100vw, 1100px" width="2172" height="724" alt="Des joueurs de pétanque sur un terrain, à côté d’un panneau « planetpetanque.com, site en construction »">
  <h1>Planet Pétanque</h1>
  <p>Suivez vos résultats de pétanque, vos statistiques, vos matchs du club et vos matchs entre copains.</p>
</main>
</body>
</html>
